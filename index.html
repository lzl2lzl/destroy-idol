<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>DESTROY IDOL x BECOME IDOL · 非官方同人图片生成器</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand" aria-label="DESTROY IDOL x BECOME IDOL">DESTROY IDOL x BECOME IDOL</div><span class="header-note">YOUR MOMENT, YOUR STAGE.</span><span class="local"><span></span>本机创作 · 无需上传</span></header>
<main>

<div class="workspace">
<section class="stage" aria-label="卡片预览">
<div class="stage-top"><span id="dimensions">900 × 1350 PX</span></div>
<div class="formats" role="group" aria-label="卡片类型"><button data-format="avatar" aria-pressed="false"><span class="shape square"></span>头像 <small>1:1</small></button><button data-format="portrait" aria-pressed="true"><span class="shape portrait"></span>卡面 <small>2:3</small></button><button data-format="landscape" aria-pressed="false"><span class="shape landscape"></span>剧情 <small>16:9</small></button></div>
<div class="canvas-area" id="dropzone"><button type="button" id="zoomPreview" class="preview-zoom" aria-label="放大预览">放大 ↗</button><div class="canvas-wrap"><canvas id="preview" width="900" height="1350" tabindex="0" role="img" aria-label="卡片预览；导入后可拖动图片或用方向键调整裁切"></canvas><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div></div>

</section>
<aside class="editor" aria-label="编辑卡片，可独立滚动" tabindex="0">
<details class="control-section editor-section" open><summary class="section-title"><span>01</span><h2>放入作品</h2></summary><div class="section-content"><div class="upload-picker-row"><label class="upload" for="imageInput"><span class="upload-icon">＋</span><b id="uploadLabel">选择一张图片</b><span>图片 / PDF · 可拖放</span><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp,image/avif,application/pdf,.pdf"></label></div><p class="muted" id="fileInfo" hidden></p><div id="pdfPageControls" class="pdf-page-row" hidden><label for="pdfPage">PDF 页码</label><input id="pdfPage" type="number" min="1" value="1" step="1"><span id="pdfPageCount"></span></div><div class="crop-adjust-heading"><label class="range-label" for="zoom">画面缩放 <output id="zoomValue">100%</output></label><button id="resetCrop" type="button" class="position-reset"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6 6 0 1 1 1 7M4 3v5h5"/></svg><span>重置构图</span></button></div><input id="zoom" type="range" min="1" max="3" value="1" step="0.01" disabled><div class="rotation-controls"><label class="range-label" for="rotation">图片旋转 <output id="rotationValue">0°</output></label><input id="rotation" type="range" min="-180" max="180" step="1" value="0" disabled></div><div class="position-controls"><label>水平位置<input id="panX" type="range" min="-1" max="1" step="0.01" value="0" disabled></label><label>垂直位置<input id="panY" type="range" min="-1" max="1" step="0.01" value="0" disabled></label></div></div></details>
<details class="control-section editor-section"><summary class="section-title"><span>02</span><h2>整体配色</h2></summary><div class="section-content"><div class="themes compact-presets" role="group" aria-label="预设配色"><button data-theme="jade" aria-label="蓝金" title="蓝金" aria-pressed="true"><span style="--swatch:linear-gradient(135deg,#22b9df 50%,#e4b66c 50%)"></span></button><button data-theme="rose" aria-label="粉银" title="粉银" aria-pressed="false"><span style="--swatch:linear-gradient(135deg,#ed69b2 50%,#bfcde0 50%)"></span></button><button data-theme="night" aria-label="紫金" title="紫金" aria-pressed="false"><span style="--swatch:linear-gradient(135deg,#7972e2 50%,#eed0a1 50%)"></span></button></div><div class="paired-colors"><div><label for="customColor">主色</label><div class="paired-color-input"><input id="customColor" type="color" value="#22b9df"><input id="colorHex" type="text" value="#22B9DF" maxlength="7" aria-label="主色色号"></div></div><div><label for="metalColor">副色</label><div class="paired-color-input"><input id="metalColor" type="color" value="#e4b66c"><input id="metalHex" type="text" value="#E4B66C" maxlength="7" aria-label="副色色号"></div></div></div><p class="muted" id="colorHelp" role="status" hidden></p><p class="muted" id="metalHint" role="status" hidden></p><div data-fields="avatar portrait"><label class="range-label" for="metalGloss">金属光泽度<output id="metalGlossValue">70%</output></label><input id="metalGloss" type="range" min="0" max="100" value="70"></div><label class="range-label" for="styleOpacity">样式透明度<output id="styleOpacityValue">100%</output></label><input id="styleOpacity" type="range" min="0" max="100" value="100"></div></details>
<details class="control-section editor-section" open><summary class="section-title"><span>03</span><h2 id="contentHeading">图层</h2></summary><div class="section-content"><div class="basic-layer" data-fields="avatar"><label class="checkbox"><input type="checkbox" id="avatarFrame" checked>卡框</label></div><div class="basic-layer" data-fields="portrait"><label class="checkbox"><input type="checkbox" id="portraitFrame" checked>卡框</label></div><div data-fields="portrait"><div class="basic-layer"><label class="checkbox layer-heading"><input type="checkbox" id="nameLayer" checked>名字条</label><input id="cardName" aria-label="名字条文字" type="text" maxlength="28" value="并不知道什么叫做可爱" placeholder="填写名字或作品标题"><label for="namePosition" style="margin-top:12px">位置</label><input id="namePosition" type="range" min="0" max="100" value="50"></div><div class="basic-layer"><label class="checkbox layer-heading"><input type="checkbox" id="rarityLayer" checked>标记</label><input id="cardNumber" aria-label="标记文字" type="text" maxlength="8" value="UR"></div></div><div data-fields="avatar"><div class="restore-row layer-title"><label class="checkbox"><input type="checkbox" id="avatarTopEnabled" checked>左上角文字</label><button type="button" class="avatar-restore" data-reset-avatar="avatarTop" aria-label="恢复左上角文字的默认位置与字号" title="重置位置与字号"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6 6 0 1 1 1 7M4 3v5h5"/></svg><span>重置位置与字号</span></button></div><div class="avatar-text-row"><input id="avatarTop" aria-label="左上角文字" type="text" maxlength="24" value="COLLECTION"></div><div class="avatar-adjust"><div class="avatar-range-row"><label class="range-label" for="avatarTopX">水平位置<output id="avatarTopXValue">4%</output></label><input id="avatarTopX" type="range" min="0" max="100" value="4" step="1"></div><div class="avatar-range-row"><label class="range-label" for="avatarTopY">垂直位置<output id="avatarTopYValue">4%</output></label><input id="avatarTopY" type="range" min="0" max="100" value="4" step="1"></div><div class="avatar-range-row"><label class="range-label" for="avatarTopSize">字号<output id="avatarTopSizeValue">31px</output></label><input id="avatarTopSize" type="range" min="12" max="120" value="31" step="1"></div><div class="avatar-color-row"><label for="avatarTopColor">文字颜色</label><input id="avatarTopColor" type="color" value="#ffffff" aria-label="avatarTop文字颜色"><input id="avatarTopHex" type="text" value="#FFFFFF" maxlength="7" spellcheck="false" aria-label="avatarTop文字色号"></div><p id="avatarTopColorHint" class="muted" role="status" hidden></p></div><div class="restore-row layer-title"><label class="checkbox"><input type="checkbox" id="avatarBottomEnabled" checked>右下角文字</label><button type="button" class="avatar-restore" data-reset-avatar="avatarBottom" aria-label="恢复右下角文字的默认位置与字号" title="重置位置与字号"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6 6 0 1 1 1 7M4 3v5h5"/></svg><span>重置位置与字号</span></button></div><div class="avatar-text-row"><input id="avatarBottom" aria-label="右下角文字" type="text" maxlength="16" value="NO.001"></div><div class="avatar-adjust"><div class="avatar-range-row"><label class="range-label" for="avatarBottomX">水平位置<output id="avatarBottomXValue">97%</output></label><input id="avatarBottomX" type="range" min="0" max="100" value="97" step="1"></div><div class="avatar-range-row"><label class="range-label" for="avatarBottomY">垂直位置<output id="avatarBottomYValue">97%</output></label><input id="avatarBottomY" type="range" min="0" max="100" value="97" step="1"></div><div class="avatar-range-row"><label class="range-label" for="avatarBottomSize">字号<output id="avatarBottomSizeValue">54px</output></label><input id="avatarBottomSize" type="range" min="12" max="120" value="54" step="1"></div><div class="avatar-color-row"><label for="avatarBottomColor">文字颜色</label><input id="avatarBottomColor" type="color" value="#fff4cb" aria-label="avatarBottom文字颜色"><input id="avatarBottomHex" type="text" value="#FFF4CB" maxlength="7" spellcheck="false" aria-label="avatarBottom文字色号"></div><p id="avatarBottomColorHint" class="muted" role="status" hidden></p></div></div><div data-fields="landscape" class="scene-editor simple-scene"><div id="sceneChoices"></div></div></div></details>

</aside><div class="export-area"><div class="export-format-row"><select id="exportFormat" aria-label="导出格式"><option value="png">PNG</option><option value="jpg">JPG</option></select></div><button id="export" class="primary" disabled><span class="export-copy"><span class="export-title">导出图片</span><span id="exportSize" class="export-size">PNG · 900 × 1350</span></span><span class="download-symbol" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button><p id="status" role="status" aria-live="polite"></p></div>
</div>

</main><dialog id="previewDialog" class="preview-dialog"><div class="preview-dialog-top"><span>预览 · 可直接拖动调整</span><button id="closePreview" type="button" aria-label="关闭放大预览">关闭 ×</button></div><div class="zoom-preview-area"></div></dialog><script src="scene.js"></script><script src="pdf-import.js"></script><script src="responsive.js"></script><script src="app.js"></script>
</body></html>
